# Course 4 Composition: everything from Course 3, PLUS the transform toolbox:
#   - string Format transform (derive the ConfigMap name)
#   - map transform (translate a friendly "size" into a replica count)
#   - CombineFromComposite (build the status URL from two fields)
#   - ToCompositeFieldPath (write results back to the XR's status)
#
# Apply this INSTEAD of course-03/composition.yaml (same name, so it updates).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app.platform.snippy.io
spec:
  compositeTypeRef:
    apiVersion: platform.snippy.io/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: configmap
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata: {}
              data:
                greeting: "placeholder"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-config"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.greeting
                toFieldPath: data.greeting

          - name: deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              metadata: {}
              spec:
                selector:
                  matchLabels:
                    app: snippy
                template:
                  metadata:
                    labels:
                      app: snippy
                  spec:
                    containers:
                      - name: snippy
                        image: "placeholder"
                        ports:
                          - containerPort: 8080
                        env:
                          - name: APP_GREETING
                            value: "placeholder"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.matchLabels.app
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.metadata.labels.app
              - type: FromCompositeFieldPath
                fromFieldPath: spec.replicas
                toFieldPath: spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.image
                toFieldPath: spec.template.spec.containers[0].image
              - type: FromCompositeFieldPath
                fromFieldPath: spec.greeting
                toFieldPath: spec.template.spec.containers[0].env[0].value

          - name: service
            base:
              apiVersion: v1
              kind: Service
              metadata: {}
              spec:
                ports:
                  - port: 80
                    targetPort: 8080
                selector:
                  app: snippy
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.app
              # Build the in-cluster URL from the Service name + namespace and
              # write it back to the XR's status so developers can read it.
              - type: CombineToComposite
                toFieldPath: status.url
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                    - fromFieldPath: metadata.namespace
                  strategy: string
                  string:
                    fmt: "http://%s.%s.svc.cluster.local"

    - step: ready
      functionRef:
        name: function-auto-ready
