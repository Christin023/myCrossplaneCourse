# Least-privilege replacement for the cluster-admin binding we used in Course 2.
# Instead of giving provider-kubernetes god mode, grant ONLY the object kinds the
# SnippyStack composition actually manages. Bind it to the named SA created by
# the DeploymentRuntimeConfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-snippystack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-snippystack
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: provider-kubernetes-snippystack
  apiGroup: rbac.authorization.k8s.io
