# Install provider-kubernetes: a provider whose "external API" is a Kubernetes
# cluster. It lets Crossplane manage arbitrary Kubernetes objects as Managed
# Resources (kind: Object). We point it at the SAME cluster it runs in.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v0.18.0
