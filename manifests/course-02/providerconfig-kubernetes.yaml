# provider-kubernetes runs as a pod with its own ServiceAccount. By default that
# SA cannot touch most cluster resources. To let it manage Objects in THIS
# cluster (InjectedIdentity = "use my own pod identity"), we grant its SA the
# permissions it needs. For a learning cluster we bind cluster-admin; in
# production you would scope this down (see Course 13).
#
# The provider SA is created in crossplane-system and named after the provider's
# active ServiceAccount. We discover it with a label selector binding instead of
# hardcoding the generated name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes            # adjust if your SA name differs
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# ProviderConfig tells every Object MR HOW to talk to the target cluster.
# InjectedIdentity means "use the provider pod's own ServiceAccount" — i.e.
# manage the local cluster. For a remote cluster you would reference a kubeconfig
# Secret here instead.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: InjectedIdentity
